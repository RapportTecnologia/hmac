name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages publica em https://<owner>.github.io/<repo>/
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Apontar URLs para o domínio real do Pages
        run: |
          SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          sed -i "s|https://hmac-lab.example.com|${SITE}|g" dist/index.html dist/sitemap.xml dist/robots.txt

      - name: Fallback SPA (deep links como /HMAC/verificar)
        run: cp dist/index.html dist/404.html

      - name: Publicar no branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
